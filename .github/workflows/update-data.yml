name: Refresh money-plan data

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node update-data.mjs
        env:
          EQUITY_CODE: '120716'
          DEBT_CODE: '119533'
          GOLD_CODE: '119212'
          LIQUID_CODE: '119069'
      - run: |
          git config user.name "money-plan bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data refresh"
          git push
